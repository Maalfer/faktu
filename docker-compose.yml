services:
  faktu:
    build: .
    container_name: faktu
    environment:
      # SQLite persistente en el volumen (para datos este esquema es suficiente
      # en despliegues personales; en producción usa Postgres).
      - DATABASE_URL=sqlite+aiosqlite:////data/faktu.db
      - AUTO_CREATE_TABLES=false
      - MEDIA_DIR=/data/media
      # ¡Cambia esta clave en un despliegue real!
      - SECRET_KEY=cambia-esta-clave-en-produccion-por-otra-segura-32b
    volumes:
      - faktu-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  faktu-data: